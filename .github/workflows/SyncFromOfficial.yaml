name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'   # 改为你想要的 UTC 时间
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 同步上游仓库
        uses: dabreadman/sync-upstream-repo@v1.3.0
        with:
          upstream_repo: https://github.com/iDvel/rime-ice.git   # 修改这里
          upstream_branch: main                               # 确认目标仓库的分支名
          downstream_branch: main                             # 你的复刻仓库分支名
          token: ${{ secrets.PAT }}
